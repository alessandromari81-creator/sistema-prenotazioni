server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API: inoltrata al backend (servizio "app" di docker-compose). L'autenticazione è il token JWT di Keycloak
    # nell'header Authorization, che nginx lascia passare com'è: niente cookie né CSRF.
    location /api/ {
        proxy_pass http://app:80;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # I file di Angular con l'impronta nel nome (main-A1B2C3D4.js, styles-....css, chunk-....js): il nome cambia quando
    # cambia il contenuto, quindi si possono tenere in cache per un anno senza rischiare di servire una versione vecchia.
    location ~* ^/(main|styles|chunk|polyfills|scripts)-[A-Za-z0-9]+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pagine dell'app Angular (compresa silent-check-sso.html usata da Keycloak): ogni percorso sconosciuto torna a index.html.
    # Questi file hanno un nome fisso e dicono quali file con impronta caricare: il browser deve ricontrollarli sempre
    # ("no-cache" = può tenerli, ma chiede al server se sono cambiati), altrimenti non scopre mai una versione nuova.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
