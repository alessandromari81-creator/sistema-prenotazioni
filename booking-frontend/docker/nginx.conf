server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API e cookie CSRF di Sanctum: inoltrati al backend (servizio "app" di docker-compose)
    location ~ ^/(api|sanctum)/ {
        proxy_pass http://app:80;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sanctum tratta una richiesta come "del frontend" solo se vede Origin o Referer: Safari non
        # invia il Referer nelle GET, quindi Origin lo imposta sempre nginx (stesso scopo di proxy.conf.json)
        proxy_set_header Origin            $scheme://$http_host;
    }

    # Pagine dell'app Angular: ogni percorso sconosciuto torna a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
