server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API: inoltrata al backend (servizio "app" di docker-compose). L'autenticazione è il token JWT di Keycloak
    # nell'header Authorization, che nginx lascia passare com'è: niente cookie né CSRF.
    location /api/ {
        proxy_pass http://app:80;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pagine dell'app Angular (compresa silent-check-sso.html usata da Keycloak): ogni percorso sconosciuto torna a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
