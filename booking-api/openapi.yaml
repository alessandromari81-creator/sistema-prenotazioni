openapi: 3.0.3

info:
  title: Palestra - API
  version: 2.0.0
  description: |
    API REST dell'applicazione della palestra (Laravel 13): corsi, istruttori, abbonamenti, iscrizioni e prenotazione
    di sale e slot.

    ## Autenticazione
    Login, registrazione e password le gestisce **Keycloak**. L'API non ha rotte di login: ogni richiesta deve portare
    il JWT rilasciato da Keycloak nell'header

    ```
    Authorization: Bearer <access token>
    ```

    Il frontend ottiene il token con il flusso *Authorization Code + PKCE*. In Swagger UI si usa il pulsante
    **Authorize**: porta al login di Keycloak e poi "Try it out" funziona; in alternativa si incolla un token a mano.
    Un token è accettato solo se la firma è valida, non è scaduto, l'emittente (`iss`) è il nostro realm e il
    destinatario (`aud`) è `palestra-api`.

    Il profilo applicativo dell'utente nasce al primo accesso: l'identità è in Keycloak (claim `sub`), i dati
    dell'applicazione in Laravel. Il ruolo `admin` arriva dal token (ruolo del realm).

    **Utenti di prova** (password `password`): `admin@example.com` (admin), `luca.verdi@example.com` e
    `sara.neri@example.com` (istruttori), `mario.rossi@example.com` (ha un abbonamento) e `anna.bianchi@example.com`
    (non ne ha uno).

    ## Ruoli
    - **Utente**: consulta corsi e piani, si iscrive e annulla la propria iscrizione, prenota sale.
    - **Istruttore**: non è un ruolo globale ma un'assegnazione a un corso. Vede gli iscritti dei corsi che insegna.
      Può essere studente di un altro corso, ma **mai** istruttore e studente dello stesso corso.
    - **Admin**: gestisce corsi, istruttori, piani e abbonamenti, sale e fasce orarie.

    ## Errori comuni
    - `401` token mancante, scaduto o non valido: `{"message": "Non autenticato."}`
    - `403` permesso negato (rotta per soli admin, elenco iscritti di un corso altrui, prenotazione altrui)
    - `404` risorsa inesistente
    - `422` validazione fallita, con l'elenco `errors` per campo (anche per le regole di business)
    - `429` troppe richieste (120 al minuto per utente), con `retry_after` in secondi e header `Retry-After`

    ## Date e orari
    Gli istanti delle prenotazioni sono in **UTC** (ISO 8601). Le fasce orarie delle sale e l'orario dei corsi
    sono nell'orario di Roma. `day_of_week`: 1 = lunedì ... 7 = domenica. Le date degli abbonamenti sono giorni
    (`AAAA-MM-GG`, estremi inclusi).

    Questo file è scritto a mano: va aggiornato insieme al codice (`routes/api.php`, Form Request, Resource).

servers:
  - url: http://localhost:8080
    description: Demo con Docker (nginx inoltra /api al backend)
  - url: http://localhost:4200
    description: Sviluppo (ng serve con proxy.conf.json)

tags:
  - name: Utenti
    description: Profilo dell'utente autenticato ed elenco utenti (admin)
  - name: Corsi
    description: I corsi della palestra. Consultazione per tutti, gestione per gli admin
  - name: Istruttori
    description: Assegnazione degli istruttori ai corsi (admin) ed elenco degli iscritti
  - name: Iscrizioni
    description: Iscriversi a un corso e vedere le proprie iscrizioni
  - name: Abbonamenti
    description: Piani di abbonamento e abbonamenti assegnati agli utenti
  - name: Sale
    description: Le sale che si possono prenotare. Scrittura solo per gli admin
  - name: Fasce orarie
    description: Quando una sala è prenotabile. Solo admin
  - name: Prenotazioni
    description: Slot liberi, elenco, creazione e annullamento delle prenotazioni di sale

security:
  - keycloak: [openid, profile, email]
  - bearerAuth: []

paths:
  /api/user:
    get:
      tags: [Utenti]
      summary: Utente autenticato
      description: |
        Il profilo di chi ha il token. Il frontend la chiama dopo il login. Al primo accesso il profilo viene creato
        da Laravel (stato comunque 200). `teaches_courses` dice se l'utente insegna in almeno un corso.
      responses:
        '200':
          description: L'utente corrente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    put:
      tags: [Utenti]
      summary: Modifica il proprio profilo
      description: |
        Aggiorna i dati del profilo che appartengono all'applicazione: per ora l'indirizzo (`null` o testo vuoto lo cancella).
        **Nome ed email non si cambiano da qui**: sono di Keycloak e Laravel li riallinea al token a ogni richiesta, quindi un
        valore cambiato qui verrebbe sovrascritto. Anche se vengono inviati, vengono ignorati. Si modifica sempre e solo il
        proprio profilo: l'utente è quello a cui appartiene il token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Il profilo aggiornato (stessa forma di GET /api/user).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/bookables:
    get:
      tags: [Sale]
      summary: Elenco delle sale prenotabili
      description: |
        Paginato, con le fasce orarie incluse. Di default solo le sale attive; l'admin può chiedere anche
        quelle disattivate con `all=1`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: sort_by
          in: query
          schema: { type: string, enum: [name, created_at, slot_minutes], default: name }
        - $ref: '#/components/parameters/SortDirection'
        - name: search
          in: query
          description: Ricerca nel nome (contiene).
          schema: { type: string, maxLength: 100 }
        - name: all
          in: query
          description: Se `1` e l'utente è admin, include le sale disattivate. Per gli altri è ignorato.
          schema: { type: boolean }
      responses:
        '200':
          description: Pagina di sale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookablePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Sale]
      summary: Crea una sala (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreBookableRequest'
      responses:
        '201':
          description: Sala creata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookable'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/bookables/{bookable}:
    parameters:
      - $ref: '#/components/parameters/BookableId'
    get:
      tags: [Sale]
      summary: Dettaglio di una sala
      description: Include le fasce orarie.
      responses:
        '200':
          description: La sala.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookable'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Sale]
      summary: Modifica una sala (admin)
      description: Si può inviare anche un solo campo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookableRequest'
      responses:
        '200':
          description: La sala aggiornata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookable'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Sale]
      summary: Elimina una sala (admin)
      description: Elimina anche le sue fasce orarie e le sue prenotazioni (cancellazione a cascata).
      responses:
        '204':
          description: Eliminata.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/bookables/{bookable}/availabilities:
    parameters:
      - $ref: '#/components/parameters/BookableId'
    post:
      tags: [Fasce orarie]
      summary: Aggiunge una fascia oraria (admin)
      description: Fasce dello stesso giorno che si sovrappongono sono rifiutate (422). Fasce che si toccano sono ammesse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAvailabilityRequest'
      responses:
        '201':
          description: Fascia creata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/availabilities/{availability}:
    delete:
      tags: [Fasce orarie]
      summary: Elimina una fascia oraria (admin)
      description: Le prenotazioni già fatte restano; non si potranno più prenotare nuovi slot in quella fascia.
      parameters:
        - name: availability
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Eliminata.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/bookables/{bookable}/slots:
    parameters:
      - $ref: '#/components/parameters/BookableId'
    get:
      tags: [Prenotazioni]
      summary: Slot liberi di una sala per un giorno
      description: |
        Calcola gli slot dalle fasce orarie (orario di Roma) e toglie quelli già prenotati o nel passato.
        Gli istanti restituiti sono in UTC.
      parameters:
        - name: date
          in: query
          required: true
          description: Giorno richiesto, da oggi in poi.
          schema: { type: string, format: date, example: '2026-11-20' }
      responses:
        '200':
          description: Elenco (anche vuoto) degli slot liberi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/bookings:
    get:
      tags: [Prenotazioni]
      summary: Elenco delle prenotazioni
      description: L'utente vede solo le proprie prenotazioni, l'admin tutte. Include sala e utente.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema: { type: integer, enum: [5, 10, 15, 20, 50], default: 10 }
        - name: sort_by
          in: query
          schema: { type: string, enum: [starts_at, created_at], default: starts_at }
        - $ref: '#/components/parameters/SortDirection'
        - name: search
          in: query
          description: Nome della sala; per l'admin anche nome dell'utente.
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [confirmed, cancelled] }
      responses:
        '200':
          description: Pagina di prenotazioni.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Prenotazioni]
      summary: Crea una prenotazione
      description: |
        Si indicano la sala e l'inizio; la fine si ricava dalla durata dello slot. Avviene in una transazione
        con lock sulla sala. Errori 422 possibili: sala non prenotabile, orario fuori dalla disponibilità,
        orario che non coincide con l'inizio di uno slot, slot già prenotato. Dopo il salvataggio l'utente
        riceve una notifica.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreBookingRequest'
      responses:
        '201':
          description: Prenotazione creata (stato `confirmed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/bookings/{booking}:
    delete:
      tags: [Prenotazioni]
      summary: Annulla una prenotazione
      description: |
        Non la cancella: imposta lo stato `cancelled`. Può farlo il proprietario o un admin; l'utente normale solo
        fino a 2 ore prima dell'inizio. Risponde 422 se è già annullata o se mancano meno di 2 ore.
      parameters:
        - name: booking
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: La prenotazione annullata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/users:
    get:
      tags: [Utenti]
      summary: Elenco degli utenti (admin)
      description: |
        Serve all'admin per scegliere chi assegnare come istruttore o a chi dare un abbonamento. Compaiono solo gli
        utenti che hanno già fatto almeno un accesso, perché i profili nascono al primo login.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: search
          in: query
          description: Cerca nel nome o nell'email (senza distinguere maiuscole).
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Pagina di utenti.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/users/{user}/subscriptions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Abbonamenti]
      summary: Abbonamenti di un utente (admin)
      description: Dal più recente al più vecchio, con il piano.
      responses:
        '200':
          description: Gli abbonamenti dell'utente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Abbonamenti]
      summary: Assegna un piano a un utente (admin)
      description: |
        La fine si calcola dalla durata del piano ed è inclusa: 30 giorni da oggi finiscono il ventinovesimo giorno
        dopo oggi. Rifiutato (422) se il piano è disattivato o se il periodo si sovrappone a un altro abbonamento
        dell'utente (anche futuro). Un abbonamento annullato non blocca.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSubscriptionRequest'
      responses:
        '201':
          description: Abbonamento assegnato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/subscriptions/{subscription}:
    delete:
      tags: [Abbonamenti]
      summary: Annulla un abbonamento (admin)
      description: |
        Non lo cancella: salva quando è stato annullato. Le iscrizioni già fatte restano valide, perché
        l'abbonamento serve per iscriversi. Risponde 422 se è già annullato.
      parameters:
        - name: subscription
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: L'abbonamento annullato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/subscription-plans:
    get:
      tags: [Abbonamenti]
      summary: Elenco dei piani di abbonamento
      description: Dal più breve al più lungo. Di default solo i piani attivi; l'admin può chiedere anche gli altri con `all=1`.
      parameters:
        - name: all
          in: query
          description: Se `1` e l'utente è admin, include i piani disattivati. Per gli altri è ignorato.
          schema: { type: boolean }
      responses:
        '200':
          description: I piani.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPlan'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Abbonamenti]
      summary: Crea un piano (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSubscriptionPlanRequest'
      responses:
        '201':
          description: Piano creato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlan'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/subscription-plans/{subscriptionPlan}:
    parameters:
      - name: subscriptionPlan
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Abbonamenti]
      summary: Modifica un piano (admin)
      description: Si può inviare anche un solo campo. Gli abbonamenti già assegnati non cambiano.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionPlanRequest'
      responses:
        '200':
          description: Il piano aggiornato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlan'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Abbonamenti]
      summary: Elimina un piano (admin)
      description: 'Rifiutato (422) se il piano è già stato assegnato a degli utenti: va disattivato, così lo storico resta leggibile.'
      responses:
        '204':
          description: Eliminato.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/courses:
    get:
      tags: [Corsi]
      summary: Elenco dei corsi
      description: |
        Paginato, con istruttori, sala, numero di iscritti, posti liberi e due informazioni su chi guarda:
        `is_enrolled` (sono iscritto?) e `is_instructor` (sono istruttore?). Di default solo i corsi attivi;
        l'admin può chiedere anche gli altri con `all=1`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: sort_by
          in: query
          schema: { type: string, enum: [name, day_of_week, start_time], default: day_of_week }
        - $ref: '#/components/parameters/SortDirection'
        - name: search
          in: query
          description: Cerca nel nome (contiene, senza distinguere maiuscole).
          schema: { type: string, maxLength: 100 }
        - name: day_of_week
          in: query
          description: Mostra solo i corsi di quel giorno (1 = lunedì ... 7 = domenica).
          schema: { type: integer, minimum: 1, maximum: 7 }
        - name: all
          in: query
          description: Se `1` e l'utente è admin, include i corsi disattivati. Per gli altri è ignorato.
          schema: { type: boolean }
      responses:
        '200':
          description: Pagina di corsi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Corsi]
      summary: Crea un corso (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCourseRequest'
      responses:
        '201':
          description: Corso creato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/courses/{course}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Corsi]
      summary: Dettaglio di un corso
      description: 'Un corso disattivato lo vedono solo gli admin: per gli altri risponde 404.'
      responses:
        '200':
          description: Il corso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Corsi]
      summary: Modifica un corso (admin)
      description: Si può inviare anche un solo campo. I posti non possono scendere sotto il numero degli iscritti attuali (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '200':
          description: Il corso aggiornato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Corsi]
      summary: Elimina un corso (admin)
      description: 'Rifiutato (422) se ha iscritti attivi: va disattivato. Con il corso spariscono le assegnazioni degli istruttori.'
      responses:
        '204':
          description: Eliminato.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/courses/{course}/instructors/{user}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Istruttori]
      summary: Assegna un istruttore al corso (admin)
      description: |
        Ripetere la chiamata non ha effetto. **Regola**: se l'utente è iscritto al corso come studente, la risposta è
        422 (`errors.user_id`): non si può essere istruttore e studente dello stesso corso. Un istruttore può invece
        essere studente di un altro corso.
      responses:
        '200':
          description: Il corso con l'elenco aggiornato degli istruttori.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Istruttori]
      summary: Toglie un istruttore dal corso (admin)
      responses:
        '200':
          description: Il corso con l'elenco aggiornato degli istruttori.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/courses/{course}/students:
    get:
      tags: [Istruttori]
      summary: Iscritti a un corso
      description: |
        Gli studenti con iscrizione valida, con nome ed email. Li vedono solo gli admin e gli istruttori di quel corso;
        per tutti gli altri (compresi gli istruttori di altri corsi) la risposta è 403.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Le iscrizioni valide, dalla più vecchia.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Enrollment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/courses/{course}/enrollment:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [Iscrizioni]
      summary: Iscriviti al corso
      description: |
        Regole, nell'ordine: il corso è attivo; non sei istruttore di quel corso; non sei già iscritto; hai un
        abbonamento attivo; non superi il numero di corsi del piano; il corso ha posti liberi. Se una regola non è
        rispettata la risposta è 422 con il messaggio nel campo `course` o `subscription`. Un'iscrizione annullata
        in precedenza viene riattivata.
      responses:
        '201':
          description: Iscrizione creata, con il corso aggiornato (iscritti, posti liberi).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Iscrizioni]
      summary: Annulla la tua iscrizione al corso
      description: La riga resta con stato `cancelled` e il posto torna libero. 422 se non sei iscritto.
      responses:
        '200':
          description: L'iscrizione annullata, con il corso aggiornato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/me/courses:
    get:
      tags: [Iscrizioni]
      summary: I corsi a cui sono iscritto
      description: Solo le iscrizioni valide, in ordine di giorno e ora.
      responses:
        '200':
          description: I corsi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/me/teaching:
    get:
      tags: [Istruttori]
      summary: I corsi che insegno
      description: Vuoto se l'utente non è istruttore di nessun corso.
      responses:
        '200':
          description: I corsi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/me/subscription:
    get:
      tags: [Abbonamenti]
      summary: Il mio abbonamento
      description: L'abbonamento attivo (oppure `null`), quanti corsi sto seguendo e quanti ne posso ancora seguire.
      responses:
        '200':
          description: Il riepilogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionUsage'
        '401':
          $ref: '#/components/responses/Unauthenticated'

components:
  securitySchemes:
    keycloak:
      type: oauth2
      description: Login con Keycloak (Authorization Code + PKCE). Il pulsante Authorize porta alla pagina di accesso.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8180/realms/palestra/protocol/openid-connect/auth
          tokenUrl: http://localhost:8180/realms/palestra/protocol/openid-connect/token
          scopes:
            openid: Identità dell'utente
            profile: Nome e cognome
            email: Indirizzo email
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: In alternativa, incolla qui un access token ottenuto da Keycloak.

  parameters:
    CourseId:
      name: course
      in: path
      required: true
      schema: { type: integer }
    UserId:
      name: user
      in: path
      required: true
      description: Identificativo dell'utente in Laravel (non quello di Keycloak).
      schema: { type: integer }
    BookableId:
      name: bookable
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    SortDirection:
      name: sort_direction
      in: query
      schema: { type: string, enum: [asc, desc], default: asc }

  responses:
    Unauthenticated:
      description: Token mancante, scaduto o non valido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Non autenticato.
    Forbidden:
      description: Permesso negato (rotta per soli admin, elenco iscritti di un corso altrui o prenotazione di un altro utente).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: This action is unauthorized.
    NotFound:
      description: Risorsa inesistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    ValidationError:
      description: Validazione fallita (formato dei dati o regola di business).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: Lo slot è già stato prenotato.
            errors:
              starts_at: [Lo slot è già stato prenotato.]
    TooManyRequests:
      description: Troppe richieste. L'header `Retry-After` indica i secondi da attendere.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsBody'
          example:
            message: Troppe richieste. Riprova tra qualche istante.
            retry_after: 59

  schemas:
    Message:
      type: object
      properties:
        message: { type: string }

    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    TooManyRequestsBody:
      type: object
      properties:
        message: { type: string }
        retry_after: { type: integer, description: 'Secondi da attendere.' }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        address: { type: string, nullable: true }
        role: { type: string, enum: [user, admin], description: 'Copia del ruolo dichiarato dal token di Keycloak.' }
        teaches_courses: { type: boolean, description: 'Presente solo in GET /api/user. Vero se l''utente insegna in almeno un corso.' }

    Availability:
      type: object
      properties:
        id: { type: integer }
        bookable_id: { type: integer }
        day_of_week: { type: integer, minimum: 1, maximum: 7, description: '1 = lunedì ... 7 = domenica' }
        start_time: { type: string, example: '09:00:00', description: 'Orario di Roma (HH:MM:SS).' }
        end_time: { type: string, example: '13:00:00', description: 'Orario di Roma (HH:MM:SS).' }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    Bookable:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        slot_minutes: { type: integer, description: 'Durata di uno slot in minuti.' }
        is_active: { type: boolean }
        availabilities:
          type: array
          description: Presente solo quando le fasce sono state caricate (elenco e dettaglio; non dopo creazione o modifica).
          items:
            $ref: '#/components/schemas/Availability'
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    Booking:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        bookable_id: { type: integer }
        starts_at: { type: string, format: date-time, description: 'Inizio in UTC.' }
        ends_at: { type: string, format: date-time, description: 'Fine in UTC.' }
        status: { type: string, enum: [confirmed, cancelled] }
        notes: { type: string, nullable: true }
        bookable:
          description: Presente nell'elenco; dopo creazione e annullamento solo se già caricata.
          allOf:
            - $ref: '#/components/schemas/Bookable'
        user:
          description: Presente nell'elenco.
          allOf:
            - $ref: '#/components/schemas/User'
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    Slot:
      type: object
      properties:
        starts_at: { type: string, format: date-time, example: '2026-11-20T08:00:00+00:00' }
        ends_at: { type: string, format: date-time, example: '2026-11-20T09:00:00+00:00' }

    PaginationLink:
      type: object
      properties:
        url: { type: string, nullable: true }
        label: { type: string }
        active: { type: boolean }

    Pagination:
      type: object
      description: Forma standard del paginatore di Laravel (senza il wrapper `data`/`meta` delle Resource).
      properties:
        current_page: { type: integer }
        first_page_url: { type: string }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        last_page_url: { type: string }
        links:
          type: array
          items:
            $ref: '#/components/schemas/PaginationLink'
        next_page_url: { type: string, nullable: true }
        path: { type: string }
        per_page: { type: integer }
        prev_page_url: { type: string, nullable: true }
        to: { type: integer, nullable: true }
        total: { type: integer }

    BookablePage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Bookable'

    BookingPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Booking'

    StoreBookableRequest:
      type: object
      required: [name, slot_minutes]
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        slot_minutes: { type: integer, minimum: 5, maximum: 480 }
        is_active: { type: boolean }

    UpdateBookableRequest:
      type: object
      description: Tutti i campi sono facoltativi.
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        slot_minutes: { type: integer, minimum: 5, maximum: 480 }
        is_active: { type: boolean }

    StoreAvailabilityRequest:
      type: object
      required: [day_of_week, start_time, end_time]
      properties:
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        start_time: { type: string, example: '09:00', description: 'Formato HH:MM.' }
        end_time: { type: string, example: '13:00', description: 'Formato HH:MM, dopo start_time.' }

    StoreBookingRequest:
      type: object
      required: [bookable_id, starts_at]
      properties:
        bookable_id: { type: integer }
        starts_at: { type: string, format: date-time, description: 'Inizio dello slot (UTC), nel futuro.' }

    UserPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/User'

    Instructor:
      type: object
      description: Un istruttore come lo vedono gli altri utenti. Niente email né dati personali.
      properties:
        id: { type: integer }
        name: { type: string }

    Student:
      type: object
      description: Uno studente come lo vedono admin e istruttori del corso.
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }

    Course:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        capacity: { type: integer, description: 'Posti disponibili.' }
        day_of_week: { type: integer, minimum: 1, maximum: 7, description: '1 = lunedì ... 7 = domenica' }
        start_time: { type: string, example: '18:30:00', description: 'Ora di inizio (orario di Roma).' }
        duration_minutes: { type: integer }
        is_active: { type: boolean }
        bookable_id: { type: integer, nullable: true }
        bookable:
          description: La sala, se il corso ne indica una.
          allOf:
            - $ref: '#/components/schemas/Bookable'
        instructors:
          type: array
          items:
            $ref: '#/components/schemas/Instructor'
        enrolled_count: { type: integer, description: 'Iscritti con iscrizione valida.' }
        spots_left: { type: integer, description: 'Posti ancora liberi (mai negativo).' }
        is_enrolled: { type: boolean, description: 'Vero se chi guarda è iscritto al corso.' }
        is_instructor: { type: boolean, description: 'Vero se chi guarda è istruttore del corso.' }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    CoursePage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Course'

    Enrollment:
      type: object
      properties:
        id: { type: integer }
        course_id: { type: integer }
        user_id: { type: integer }
        status: { type: string, enum: [active, cancelled] }
        course:
          description: Presente quando l'iscrizione viene creata o annullata.
          allOf:
            - $ref: '#/components/schemas/Course'
        student:
          description: Presente nell'elenco degli iscritti di un corso.
          allOf:
            - $ref: '#/components/schemas/Student'
        created_at: { type: string, format: date-time, nullable: true }

    SubscriptionPlan:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        duration_days: { type: integer }
        max_courses: { type: integer, description: 'Corsi seguibili contemporaneamente.' }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    Subscription:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        subscription_plan_id: { type: integer }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, description: 'Ultimo giorno di validità, incluso.' }
        cancelled_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean, description: 'Vero se non è annullato e oggi è compreso nel periodo.' }
        plan:
          $ref: '#/components/schemas/SubscriptionPlan'
        created_at: { type: string, format: date-time, nullable: true }

    SubscriptionUsage:
      type: object
      properties:
        subscription:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Subscription'
        courses_used: { type: integer, description: 'Iscrizioni valide dell''utente.' }
        courses_left: { type: integer, description: 'Corsi ancora seguibili (0 senza abbonamento attivo).' }

    StoreCourseRequest:
      type: object
      required: [name, capacity, day_of_week, start_time, duration_minutes]
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 2000 }
        capacity: { type: integer, minimum: 1, maximum: 200 }
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        start_time: { type: string, example: '18:30', description: 'Formato HH:MM.' }
        duration_minutes: { type: integer, minimum: 15, maximum: 240 }
        bookable_id: { type: integer, nullable: true, description: 'La sala in cui si tiene il corso (una sala esistente).' }
        is_active: { type: boolean, default: true }

    UpdateCourseRequest:
      type: object
      description: Tutti i campi sono facoltativi.
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 2000 }
        capacity: { type: integer, minimum: 1, maximum: 200 }
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        start_time: { type: string, example: '18:30', description: 'Formato HH:MM.' }
        duration_minutes: { type: integer, minimum: 15, maximum: 240 }
        bookable_id: { type: integer, nullable: true }
        is_active: { type: boolean }

    StoreSubscriptionPlanRequest:
      type: object
      required: [name, duration_days, max_courses]
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 2000 }
        duration_days: { type: integer, minimum: 1, maximum: 1095 }
        max_courses: { type: integer, minimum: 1, maximum: 50 }
        is_active: { type: boolean, default: true }

    UpdateSubscriptionPlanRequest:
      type: object
      description: Tutti i campi sono facoltativi.
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 2000 }
        duration_days: { type: integer, minimum: 1, maximum: 1095 }
        max_courses: { type: integer, minimum: 1, maximum: 50 }
        is_active: { type: boolean }

    StoreSubscriptionRequest:
      type: object
      required: [subscription_plan_id]
      properties:
        subscription_plan_id: { type: integer, description: 'Un piano attivo.' }
        starts_on: { type: string, format: date, nullable: true, description: 'Giorno di inizio, da oggi in poi. Se manca, oggi.' }

    UpdateProfileRequest:
      type: object
      properties:
        address: { type: string, nullable: true, maxLength: 255, description: 'Indirizzo dell''utente. Vuoto o null lo cancella.' }
